name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-theme-catalog.cjs
      - run: npm run build
      - run: npm run test:desktop
      - run: npx playwright install chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        name: Playwright diagnostics
        with:
          name: playwright-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
