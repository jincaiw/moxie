name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-theme-catalog.cjs
      - run: npm run build
      - run: npm run test:desktop
      - run: npx playwright install chromium
      - run: npm test
      - name: Repeat desktop navigation without retries
        run: npx playwright test tests/workspace.spec.ts -g "桌面侧栏首屏" --repeat-each=10 --workers=2 --retries=0
      - name: Repeat editor menu boundaries without retries
        run: npx playwright test tests/features.spec.ts -g "编辑区右键格式菜单|格式菜单尺寸变化" --repeat-each=10 --workers=2 --retries=0
      - name: Repeat keyboard navigation without retries
        run: npx playwright test -g "侧栏标签支持|文档标签键盘导航|已打开列表方向键|取消关闭与保存失败" --repeat-each=5 --workers=2 --retries=0
      - name: Repeat folder actions without retries
        run: npx playwright test tests/workspace.spec.ts -g "文件操作面板" --repeat-each=5 --workers=2 --retries=0
      - name: Repeat search state transitions without retries
        run: npx playwright test tests/workspace.spec.ts -g "跨文档搜索清除" --repeat-each=5 --workers=2 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        name: Playwright diagnostics
        with:
          name: playwright-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
