name: Publish desktop release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  verify:
    name: Verify release source
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches package version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: node scripts/verify-theme-catalog.cjs
      - run: npm run build
      - run: npm run test:desktop
      - run: npx playwright install chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        name: Playwright diagnostics
        with:
          name: playwright-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }} package
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-15
            arch: arm64
          - platform: macOS
            os: macos-15-intel
            arch: x64
          - platform: Windows
            os: windows-latest
            arch: x64
          - platform: Linux
            os: ubuntu-22.04
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure optional macOS signing credentials
        if: matrix.platform == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$MACOS_CERTIFICATE" ]]; then
            echo "CSC_LINK=$MACOS_CERTIFICATE" >> "$GITHUB_ENV"
            if [[ -n "$MACOS_CERTIFICATE_PASSWORD" ]]; then
              echo "CSC_KEY_PASSWORD=$MACOS_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            fi
          fi
          if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi
      - name: Build macOS packages
        if: matrix.platform == 'macOS'
        run: npm run package:mac -- --${{ matrix.arch }}
      - name: Build Windows installer
        if: matrix.platform == 'Windows'
        run: npm run package:win
      - name: Build Linux AppImage
        if: matrix.platform == 'Linux'
        run: npm run package:linux
      - uses: actions/upload-artifact@v4
        name: Upload desktop packages
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/Moxie-*.dmg
            release/Moxie-*.zip
            release/Moxie-*.zip.blockmap
            release/Moxie-*.exe
            release/Moxie-*.exe.blockmap
            release/Moxie-*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        name: Upload update metadata
        with:
          name: update-info-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/latest-mac.yml
            release/latest.yml
            release/latest-linux.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: update-info-macOS-arm64
          path: release/update-info/arm64
      - uses: actions/download-artifact@v4
        with:
          name: update-info-macOS-x64
          path: release/update-info/x64
      - name: Merge architecture update metadata
        run: >-
          node scripts/merge-mac-update-info.cjs
          release/update-info/arm64/latest-mac.yml
          release/update-info/x64/latest-mac.yml
          release/latest-mac.yml
      - name: Stage curated theme gallery
        run: |
          cp public/theme-catalog-v1.json release/
          cp public/themes/theme-*.css public/themes/theme-*.svg release/
      - uses: actions/download-artifact@v4
        with:
          name: update-info-Windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: update-info-Linux-x64
          path: release
      - name: Generate checksums
        run: cd release && shasum -a 256 Moxie-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Moxie ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Desktop packages for macOS (Apple Silicon and Intel), Windows (x64), and Linux AppImage (x64).

            **macOS distribution status:** Developer ID signing and notarization run when the repository secrets `MACOS_CERTIFICATE`, `MACOS_CERTIFICATE_PASSWORD`, `APPLE_ID`, `APPLE_APP_SPECIFIC_PASSWORD`, and `APPLE_TEAM_ID` are configured. Without them, macOS automatic installation is unavailable. Linux in-app updates require the AppImage build. Windows uses the NSIS installer.

            See `SHA256SUMS.txt` to verify downloaded files.
          files: |
            release/Moxie-*
            release/latest*.yml
            release/theme-catalog-v1.json
            release/theme-*.css
            release/theme-*.svg
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
