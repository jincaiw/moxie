name: Publish macOS release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches package version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm run build
      - run: npm run test:desktop
      - run: npx playwright install --with-deps chromium
      - run: npm test
  build:
    name: Build ${{ matrix.arch }} macOS package
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure optional macOS signing credentials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$MACOS_CERTIFICATE" ]]; then
            echo "CSC_LINK=$MACOS_CERTIFICATE" >> "$GITHUB_ENV"
            if [[ -n "$MACOS_CERTIFICATE_PASSWORD" ]]; then
              echo "CSC_KEY_PASSWORD=$MACOS_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            fi
          fi
          if [[ -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
          fi
      - run: npm run package:mac -- --${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        name: Upload macOS packages
        with:
          name: macOS-${{ matrix.arch }}
          path: |
            release/Moxie-*-${{ matrix.arch }}.dmg
            release/Moxie-*-${{ matrix.arch }}.zip
            release/Moxie-*-${{ matrix.arch }}.zip.blockmap
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        name: Upload update metadata
        with:
          name: update-info-${{ matrix.arch }}
          path: release/latest-mac.yml
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: macOS-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: update-info-arm64
          path: release/update-info/arm64
      - uses: actions/download-artifact@v4
        with:
          name: update-info-x64
          path: release/update-info/x64
      - name: Merge architecture update metadata
        run: >-
          node scripts/merge-mac-update-info.cjs
          release/update-info/arm64/latest-mac.yml
          release/update-info/x64/latest-mac.yml
          release/latest-mac.yml
      - name: Generate checksums
        run: cd release && shasum -a 256 Moxie-*.dmg Moxie-*.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Moxie ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            macOS packages for Apple Silicon (arm64) and Intel (x64).

            **Distribution status:** Developer ID signing and notarization run when the repository secrets `MACOS_CERTIFICATE`, `MACOS_CERTIFICATE_PASSWORD`, `APPLE_ID`, `APPLE_APP_SPECIFIC_PASSWORD`, and `APPLE_TEAM_ID` are configured. Without them, packages remain unsigned and automatic installation is unavailable. Users on v0.16.35 and earlier must manually install a signed baseline before in-app updates can work. First launch and update behavior still need validation on physical Macs.

            See `SHA256SUMS.txt` to verify downloaded files.
          files: |
            release/Moxie-*.dmg
            release/Moxie-*.zip
            release/Moxie-*.zip.blockmap
            release/latest-mac.yml
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
